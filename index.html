<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#21150f"><title>ローマ字ガンマン</title><link rel="stylesheet" href="style.css?v=11"><script defer src="game.js?v=11"></script></head>
<body><main id="game" data-scene="menu">
<div id="stage" aria-hidden="true"></div>
<header><button id="home" class="small" hidden>メニュー</button><span id="status"></span><label id="volume-label">音量 <input id="volume" aria-label="音量" type="range" min="0" max="100"></label><button id="mute" class="small">消音</button></header>
<section id="screen" aria-label="ゲーム画面"></section>
<div id="targets"></div><img id="weapon" src="gun.webp" alt="" hidden><div id="flash" hidden></div>
<footer id="controls" hidden><button id="hint">ヒント</button><div id="keyboard" hidden></div><p id="feedback" role="status" aria-live="polite"></p></footer>
</main></body></html>
